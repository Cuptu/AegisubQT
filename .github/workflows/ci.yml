name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: qt5compat qtshadertools qtmultimedia
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git"


      - name: Setup build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libxcb-cursor0 file libicu-dev fonts-dejavu-core pkg-config ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Setup build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja icu4c pkg-config ffmpeg
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --parallel

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log || {
            echo "::error::--- BUILD FAILURE LOG (${{ matrix.os }}) ---"
            grep -i -E "error:|fatal:|failed:|undefined symbol" build.log | head -n 30 | while IFS= read -r l; do
              echo "::error::[error] $l"
            done
            tail -n 30 build.log | while IFS= read -r l; do
              echo "::error::[tail] $l"
            done
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore

      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Headless smoke test: the app must stay alive (timeout exit code 124)
      # after loading QML; a startup failure exits non-zero before the timeout.
      - name: Smoke test (Linux, offscreen)
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          set +e
          timeout 10s ./build/AegisubQT > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "::error::Smoke test failed with exit code $code"
            exit "$code"
          fi

      # Stage app payload, deploy Qt runtime, prune unneeded modules, and package Windows artifact
      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_win | Out-Null
          Copy-Item build\AegisubQT.exe dist_win\
          Copy-Item build\icu*.dll dist_win\
          Copy-Item -Recurse build\licenses dist_win\
          Copy-Item -Recurse qml dist_win\
          if (Test-Path build\assets) { Copy-Item -Recurse build\assets dist_win\ } else { Copy-Item -Recurse assets dist_win\ }
          if (Test-Path build\automation) { Copy-Item -Recurse build\automation dist_win\ } else { Copy-Item -Recurse automation dist_win\ }
          if (Test-Path build\locale) { Copy-Item -Recurse build\locale dist_win\ }
          windeployqt --release --compiler-runtime --no-opengl-sw --include-plugins qoffscreen --qmldir qml --dir dist_win dist_win\AegisubQT.exe

          # Remove QML profiling/debugging DLLs
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qmltooling

          # Remove unused alternative mobile/desktop QML styles (AegisubQT uses native/custom style)
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick\Controls\Material
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick\Controls\Universal
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick\Controls\Imagine
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick\Controls\FluentWinUI3
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick\VirtualKeyboard
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick3D
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist_win\qml\QtQuick\Timeline

          # Remove standalone redist installers and intermediate build artifacts
          Remove-Item -Path dist_win\vc_redist*.exe -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path dist_win -Include *.lib,*.exp,*.obj -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          # Ensure MSVC runtime DLLs are present
          $needed = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          $missing = @($needed | Where-Object { !(Test-Path "dist_win\$_") })
          if ($missing.Count -gt 0 -and $env:VCToolsRedistDir) {
              $crtDir = Get-ChildItem -Path "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($crtDir) {
                  Get-ChildItem -LiteralPath $crtDir.FullName -Filter *.dll | Copy-Item -Destination dist_win\
              }
          }
          $missing = @($needed | Where-Object { !(Test-Path "dist_win\$_") })
          if ($missing.Count -gt 0) { throw "Missing deployed MSVC runtime: $($missing -join ', ')" }

      - name: Smoke test deployed payload (Windows, isolated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/SmokeWindows.ps1 -AppDirectory dist_win

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AegisubQT-windows-x64
          path: dist_win/
          if-no-files-found: error

      - name: Build and verify pinned AstraCore runtime (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/BuildMacAstraCore.sh

      # Stage resources, deploy Qt runtime, ad-hoc sign, and verify bundle on macOS.
      - name: Deploy Qt runtime and verify bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          trap 'echo "::error::Deploy failed on line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p build/AegisubQT.app/Contents/Resources/locale
          cp packages/osx/Info.plist.in build/AegisubQT.app/Contents/Info.plist
          cp -R qml assets automation build/AegisubQT.app/Contents/Resources/
          cp assets/icons_native/*.icns build/AegisubQT.app/Contents/Resources/
          # Copy compiled translation .qm files from whichever build tree location they reside
          if compgen -G "build/*.qm" > /dev/null; then
            cp build/*.qm build/AegisubQT.app/Contents/Resources/locale/
          fi
          if compgen -G "build/locale/*.qm" > /dev/null; then
            cp build/locale/*.qm build/AegisubQT.app/Contents/Resources/locale/
          fi
          if compgen -G "build/AegisubQT.app/Contents/MacOS/locale/*.qm" > /dev/null; then
            cp build/AegisubQT.app/Contents/MacOS/locale/*.qm build/AegisubQT.app/Contents/Resources/locale/
          fi
          macdeployqt build/AegisubQT.app -qmldir="$GITHUB_WORKSPACE/qml" -verbose=1
          bash .github/scripts/DeployMacAstraCore.sh "$PWD/build/AegisubQT.app"
          xattr -cr build/AegisubQT.app
          # Thin universal binaries to pure arm64 to remove dead x86_64 slices
          find build/AegisubQT.app/Contents/Frameworks build/AegisubQT.app/Contents/PlugIns build/AegisubQT.app/Contents/MacOS -path "*/Frameworks/astracore" -prune -o -type f \( -name "*.dylib" -o -perm +111 \) -print 2>/dev/null | while IFS= read -r f; do
            if [ ! -L "$f" ] && lipo -info "$f" 2>/dev/null | grep -q "x86_64"; then
              if lipo -thin arm64 "$f" -output "${f}.arm64" 2>/dev/null; then
                mv "${f}.arm64" "$f"
              else
                rm -f "${f}.arm64"
              fi
            fi
          done

          # Strip non-global symbols from Mach-O dynamic libraries and frameworks before signing
          find build/AegisubQT.app/Contents/Frameworks -path "*/Frameworks/astracore" -prune -o -type f \( -name "*.dylib" -o -perm +111 \) -exec strip -x {} + 2>/dev/null || true
          find build/AegisubQT.app/Contents/PlugIns -type f -name "*.dylib" -exec strip -x {} + 2>/dev/null || true
          strip -x build/AegisubQT.app/Contents/MacOS/AegisubQT 2>/dev/null || true

          # Remove QML profiling/debugging dylibs not needed in production releases
          rm -rf build/AegisubQT.app/Contents/PlugIns/qmltooling 2>/dev/null || true

          # Remove unused alternative mobile/desktop QML styles (AegisubQT uses native/custom style)
          rm -rf build/AegisubQT.app/Contents/Resources/qml/QtQuick/Controls/{Material,Universal,Imagine,FluentWinUI3} 2>/dev/null || true
          rm -rf build/AegisubQT.app/Contents/Resources/qml/QtQuick/VirtualKeyboard 2>/dev/null || true
          rm -rf build/AegisubQT.app/Contents/Resources/qml/QtQuick3D 2>/dev/null || true
          rm -rf build/AegisubQT.app/Contents/Resources/qml/QtQuick/Timeline 2>/dev/null || true

          # Remove redundant developer metadata and intermediate build files
          find build/AegisubQT.app -path "*/Frameworks/astracore" -prune -o -type f \( -name "*.prl" -o -name "*.la" -o -name "*.cmake" \) -exec rm -f {} + 2>/dev/null || true
          find build/AegisubQT.app/Contents/Frameworks -type d -name "Headers" -exec rm -rf {} + 2>/dev/null || true

          # Clean up any non-binary resource directories from Contents/MacOS that violate bundle layout
          rm -rf build/AegisubQT.app/Contents/MacOS/{assets,automation,qml,locale} 2>/dev/null || true

          if [ -d build/AegisubQT.app/Contents/Frameworks ]; then
            find build/AegisubQT.app/Contents/Frameworks -path "*/Frameworks/astracore" -prune -o -type f -name "*.dylib" -exec codesign --force --timestamp=none --sign - {} + 2>/dev/null || true
            for fw in build/AegisubQT.app/Contents/Frameworks/*.framework; do
              if [ -d "$fw" ]; then
                codesign --force --timestamp=none --sign - "$fw"
              fi
            done
          fi
          if [ -d build/AegisubQT.app/Contents/PlugIns ]; then
            find build/AegisubQT.app/Contents/PlugIns -type f -name "*.dylib" -exec codesign --force --timestamp=none --sign - {} + 2>/dev/null || true
          fi

          echo "Signing app bundle..."
          if ! codesign_out=$(codesign -vvv --force --timestamp=none --sign - --entitlements packages/osx/aegisub.entitlements build/AegisubQT.app 2>&1); then
            echo "::error::codesign bundle failed: $codesign_out"
            exit 1
          fi
          echo "$codesign_out"

          echo "Verifying app bundle..."
          if ! verify_out=$(codesign --verify --deep --strict --verbose=2 build/AegisubQT.app 2>&1); then
            echo "::error::codesign verify failed: $verify_out"
            exit 1
          fi
          echo "$verify_out"

          echo "Creating compressed DMG disk image..."
          mkdir -p dmg_staging
          ditto "build/AegisubQT.app" "dmg_staging/AegisubQT.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "AegisubQT" -srcfolder dmg_staging -ov -format UDZO build/AegisubQT-macos-arm64.dmg
          rm -rf dmg_staging

      - name: Verify complete AstraCore payload in final DMG (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/VerifyMacDmg.sh build/AegisubQT-macos-arm64.dmg

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AegisubQT-macos-arm64
          path: build/AegisubQT-macos-arm64.dmg
          if-no-files-found: error

      # Package self-contained Linux AppImage bundling Qt runtime and dependencies
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20240109-1/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O linuxdeploy-plugin-appimage
          chmod +x linuxdeploy linuxdeploy-plugin-qt linuxdeploy-plugin-appimage

          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(which qmake 2>/dev/null || which qmake6 2>/dev/null || echo "${QT_ROOT_DIR}/bin/qmake")"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/qml"
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:$LD_LIBRARY_PATH"

          echo "Qt root: $QT_ROOT_DIR"
          echo "QMake binary: $QMAKE"
          "$QMAKE" -query || true

          cmake --install build --prefix AppDir/usr
          cp packaging/AegisubQT.desktop AppDir/AegisubQT.desktop
          cp assets/branding/icon_64.png AppDir/AegisubQT.png
          if [ -f assets/branding/AegisubQT.svg ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
            cp assets/branding/AegisubQT.svg AppDir/usr/share/icons/hicolor/scalable/apps/AegisubQT.svg
          fi

          mkdir -p AppDir/usr/lib
          cp -P /usr/lib/x86_64-linux-gnu/libxcb-cursor.so* AppDir/usr/lib/ 2>/dev/null || true

          # Deploy Qt runtime and plugins into AppDir
          ./linuxdeploy --appdir AppDir \
            --library AppDir/usr/lib/libAstraCore.Native.so \
            --executable "$(command -v ffmpeg)" \
            --desktop-file AppDir/AegisubQT.desktop \
            --icon-file AppDir/AegisubQT.png \
            --plugin qt

          cp build/third_party/astracore/astra_native_dynamic_load AppDir/usr/bin/
          cmake -DLOADER="$PWD/AppDir/usr/bin/astra_native_dynamic_load" \
            -DNATIVE="$PWD/AppDir/usr/lib/libAstraCore.Native.so" \
            -DFFMPEG_EXECUTABLE="$PWD/AppDir/usr/bin/ffmpeg" \
            -DWORK_DIR="$RUNNER_TEMP/deployed-native-media" -P cmake/VerifyNativeMedia.cmake
          rm AppDir/usr/bin/astra_native_dynamic_load

          # Strip binaries and prune unused QML styles
          strip --strip-unneeded AppDir/usr/bin/* AppDir/usr/lib/*.so* AppDir/usr/plugins/*/*.so 2>/dev/null || true
          rm -rf AppDir/usr/plugins/qmltooling 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick/Controls/{Material,Universal,Imagine,FluentWinUI3} 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick/VirtualKeyboard 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick3D 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick/Timeline 2>/dev/null || true

          # Generate standalone AppImage
          OUTPUT="AegisubQT-linux-x64.AppImage"
          export OUTPUT
          export LDAI_OUTPUT="AegisubQT-linux-x64.AppImage"
          ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/AegisubQT.desktop \
            --icon-file AppDir/AegisubQT.png \
            --output appimage

      - name: Smoke test (Linux AppImage, offscreen)
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          export APPIMAGE_EXTRACT_AND_RUN=1
          set +e
          timeout 10s ./AegisubQT-linux-x64.AppImage --appimage-extract-and-run > smoke-appimage.log 2>&1
          code=$?
          set -e
          cat smoke-appimage.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "::error::AppImage smoke test failed with exit code $code"
            exit "$code"
          fi

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AegisubQT-linux-x64
          path: AegisubQT-linux-x64.AppImage
          if-no-files-found: error
