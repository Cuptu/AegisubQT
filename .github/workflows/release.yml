name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare native Qt archive extractor
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (!(Test-Path -LiteralPath $sevenZip)) { choco install 7zip --yes --no-progress }
          if (!(Test-Path -LiteralPath $sevenZip)) { throw 'Native 7-Zip extractor is missing' }
          Split-Path -Parent $sevenZip | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: qt5compat qtshadertools qtmultimedia
          cache: true
          aqtsource: "https://codeload.github.com/miurahr/aqtinstall/zip/076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          extra: '--external 7z'

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja and Inno Setup
        run: choco install -y ninja innosetup

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${env:Qt6_DIR}"

      - name: Build
        run: cmake --build build --parallel

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packages/win_installer/build-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Build portable zip
        run: powershell -ExecutionPolicy Bypass -File packages/win_installer/portable/create-portable.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/AegisubQT-${{ steps.ver.outputs.version }}.exe

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/AegisubQT-${{ steps.ver.outputs.version }}-portable.zip

  linux:
    name: Linux (tar.xz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: qt5compat qtshadertools qtmultimedia
          cache: true
          aqtsource: "https://codeload.github.com/miurahr/aqtinstall/zip/076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Setup build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libxcb-cursor0 file libicu-dev pkg-config ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test native media backend
        run: ctest --test-dir build --output-on-failure -R '^astra_native_'

      - name: Stage install tree
        run: cmake --install build --prefix staging

      - name: Create tarball
        run: tar -C staging -cJf AegisubQT-${{ steps.ver.outputs.version }}.tar.xz bin lib share

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: AegisubQT-${{ steps.ver.outputs.version }}.tar.xz

      # Self-contained AppImage: bundles the Qt runtime so end users do not need
      # a matching system Qt. The tarball above remains for distro packagers.
      - name: Install linuxdeploy tooling
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20240109-1/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O linuxdeploy-plugin-appimage
          chmod +x linuxdeploy linuxdeploy-plugin-qt linuxdeploy-plugin-appimage

      - name: Build AppImage
        run: |
          export PATH="$PWD:$PATH"
          cmake --install build --prefix AppDir/usr
          cp packaging/AegisubQT.desktop AppDir/AegisubQT.desktop
          cp assets/branding/icon_64.png AppDir/AegisubQT.png
          if [ -f assets/branding/AegisubQT.svg ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
            cp assets/branding/AegisubQT.svg AppDir/usr/share/icons/hicolor/scalable/apps/AegisubQT.svg
          fi
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(which qmake 2>/dev/null || which qmake6 2>/dev/null || echo "${QT_ROOT_DIR}/bin/qmake")"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/qml"
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:$LD_LIBRARY_PATH"
          mkdir -p AppDir/usr/lib
          cp -P /usr/lib/x86_64-linux-gnu/libxcb-cursor.so* AppDir/usr/lib/ 2>/dev/null || true

          # Deploy Qt runtime and plugins into AppDir
          ./linuxdeploy --appdir AppDir \
            --library AppDir/usr/lib/libAstraCore.Native.so \
            --library /usr/lib/x86_64-linux-gnu/libass.so.9 \
            --executable "$(command -v ffmpeg)" \
            --desktop-file AppDir/AegisubQT.desktop \
            --icon-file AppDir/AegisubQT.png \
            --plugin qt

          cp build/third_party/astracore/astra_native_dynamic_load AppDir/usr/bin/
          cmake -DLOADER="$PWD/AppDir/usr/bin/astra_native_dynamic_load" \
            -DNATIVE="$PWD/AppDir/usr/lib/libAstraCore.Native.so" \
            -DFFMPEG_EXECUTABLE="$PWD/AppDir/usr/bin/ffmpeg" \
            -DWORK_DIR="$RUNNER_TEMP/deployed-native-media" -P cmake/VerifyNativeMedia.cmake
          rm AppDir/usr/bin/astra_native_dynamic_load

          # Strip binaries and prune unused QML styles
          strip --strip-unneeded AppDir/usr/bin/* AppDir/usr/lib/*.so* AppDir/usr/plugins/*/*.so 2>/dev/null || true
          rm -rf AppDir/usr/plugins/qmltooling 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick/Controls/{Material,Universal,Imagine,FluentWinUI3} 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick/VirtualKeyboard 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick3D 2>/dev/null || true
          rm -rf AppDir/usr/qml/QtQuick/Timeline 2>/dev/null || true

          # Generate final AppImage
          OUTPUT="AegisubQT-${{ steps.ver.outputs.version }}-x86_64.AppImage"
          export OUTPUT
          export LDAI_OUTPUT="$OUTPUT"
          ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/AegisubQT.desktop \
            --icon-file AppDir/AegisubQT.png \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: AegisubQT-${{ steps.ver.outputs.version }}-x86_64.AppImage

  macos:
    name: macOS (dmg)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          brew install ninja icu4c pkg-config ffmpeg
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: qt5compat qtshadertools qtmultimedia
          cache: true
          aqtsource: "https://codeload.github.com/miurahr/aqtinstall/zip/076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test native media backend
        run: ctest --test-dir build --output-on-failure -R '^astra_native_'

      - name: Build and verify pinned AstraCore runtime
        run: bash .github/scripts/BuildMacAstraCore.sh

      # macdeployqt only deploys Qt modules; the app's own QML/assets/automation/
      # locale payloads must be staged into Contents/Resources manually. main.cpp
      # and LanguageManager both search the Resources layout.
      - name: Stage app resources into bundle
        run: |
          mkdir -p build/AegisubQT.app/Contents/Resources/locale
          cp packages/osx/Info.plist.in build/AegisubQT.app/Contents/Info.plist
          cp -R assets automation build/AegisubQT.app/Contents/Resources/
          cp assets/icons_native/*.icns build/AegisubQT.app/Contents/Resources/
          if compgen -G "build/*.qm" > /dev/null; then
            cp build/*.qm build/AegisubQT.app/Contents/Resources/locale/
          fi
          if compgen -G "build/locale/*.qm" > /dev/null; then
            cp build/locale/*.qm build/AegisubQT.app/Contents/Resources/locale/
          fi
          if compgen -G "build/AegisubQT.app/Contents/MacOS/locale/*.qm" > /dev/null; then
            cp build/AegisubQT.app/Contents/MacOS/locale/*.qm build/AegisubQT.app/Contents/Resources/locale/
          fi

      # macdeployqt modifies Mach-O headers via install_name_tool, breaking pre-existing
      # code signatures. We re-sign every framework, plugin, and the outer bundle with
      # ad-hoc signing and entitlements before packaging to avoid Gatekeeper "damaged" errors.
      - name: Deploy Qt runtime, sign bundle and create dmg
        run: |
          bash .github/scripts/DeployMacQml.sh "$PWD/build/AegisubQT.app"
          bash .github/scripts/DeployMacAstraCore.sh "$PWD/build/AegisubQT.app"
          xattr -cr build/AegisubQT.app
          # Thin universal binaries to pure arm64 to remove dead x86_64 slices
          find build/AegisubQT.app/Contents/Frameworks build/AegisubQT.app/Contents/PlugIns build/AegisubQT.app/Contents/MacOS -type f \( -name "*.dylib" -o -perm +111 \) -print 2>/dev/null | while IFS= read -r f; do
            if [ ! -L "$f" ] && lipo -info "$f" 2>/dev/null | grep -q "x86_64"; then
              if lipo -thin arm64 "$f" -output "${f}.arm64" 2>/dev/null; then
                mv "${f}.arm64" "$f"
              else
                rm -f "${f}.arm64"
              fi
            fi
          done

          # Strip non-global symbols from Mach-O dynamic libraries and frameworks before signing
          find build/AegisubQT.app/Contents/Frameworks -type f \( -name "*.dylib" -o -perm +111 \) -exec strip -x {} + 2>/dev/null || true
          find build/AegisubQT.app/Contents/PlugIns -type f -name "*.dylib" -exec strip -x {} + 2>/dev/null || true
          strip -x build/AegisubQT.app/Contents/MacOS/AegisubQT 2>/dev/null || true

          # Remove QML profiling/debugging dylibs not needed in production releases
          rm -rf build/AegisubQT.app/Contents/PlugIns/qmltooling 2>/dev/null || true

          # Preserve all QML modules and styles selected by the deployment scanner.

          # Remove redundant developer metadata and intermediate build files
          find build/AegisubQT.app -path "*/Resources/astracore" -prune -o -type f \( -name "*.prl" -o -name "*.la" -o -name "*.cmake" \) -exec rm -f {} + 2>/dev/null || true
          find build/AegisubQT.app/Contents/Frameworks -type d -name "Headers" -exec rm -rf {} + 2>/dev/null || true

          # Clean up any non-binary resource directories from Contents/MacOS that violate bundle layout
          rm -rf build/AegisubQT.app/Contents/MacOS/{assets,automation,qml,locale} 2>/dev/null || true

          if [ -d build/AegisubQT.app/Contents/Frameworks ]; then
            find build/AegisubQT.app/Contents/Frameworks -type f -name "*.dylib" -exec codesign --force --timestamp=none --sign - {} + 2>/dev/null || true
            for fw in build/AegisubQT.app/Contents/Frameworks/*.framework; do
              if [ -d "$fw" ]; then
                codesign --force --timestamp=none --sign - "$fw"
              fi
            done
          fi
          if [ -d build/AegisubQT.app/Contents/PlugIns ]; then
            find build/AegisubQT.app/Contents/PlugIns -type f -name "*.dylib" -exec codesign --force --timestamp=none --sign - {} + 2>/dev/null || true
          fi

          echo "Signing app bundle..."
          if ! codesign_out=$(codesign -vvv --force --timestamp=none --sign - --entitlements packages/osx/aegisub.entitlements build/AegisubQT.app 2>&1); then
            echo "::error::codesign bundle failed: $codesign_out"
            exit 1
          fi
          echo "$codesign_out"

          echo "Verifying app bundle..."
          if ! verify_out=$(codesign --verify --deep --strict --verbose=2 build/AegisubQT.app 2>&1); then
            echo "::error::codesign verify failed: $verify_out"
            exit 1
          fi
          echo "$verify_out"

          mkdir -p dmg_staging
          ditto "build/AegisubQT.app" "dmg_staging/AegisubQT.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "AegisubQT" -srcfolder dmg_staging -ov -format UDZO "AegisubQT-${{ steps.ver.outputs.version }}.dmg"
          rm -rf dmg_staging

      - name: Verify complete AstraCore payload in final DMG
        run: bash .github/scripts/VerifyMacDmg.sh "AegisubQT-${{ steps.ver.outputs.version }}.dmg"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: AegisubQT-${{ steps.ver.outputs.version }}.dmg

  release:
    name: Publish release assets
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: dist/*
